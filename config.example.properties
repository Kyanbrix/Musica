# Copy this file to config.properties (next to the jar / in the working directory,
# or in src/main/resources) and fill in the values. Never commit config.properties.
# Every key can also be supplied as an environment variable: upper-case it and replace
# dots with underscores, e.g. lavalink.password -> LAVALINK_PASSWORD.

# Discord bot token (required)
TOKEN=

# Lavalink node (password is required). Lavalink's default port is 2333.
lavalink.name=kyanbrix
lavalink.uri=ws://127.0.0.1:2333
lavalink.password=

# Command prefix
prefix=?

# Search provider used for plain-text queries: ytsearch, ytmsearch, scsearch, spsearch (LavaSrc), ...
search.provider=ytsearch

# Leave the voice channel after this many seconds with an empty queue or no listeners
idle.timeout.seconds=180

# Spotify API credentials (optional, used by SpotifyApiClient)
spotify.clientId=
spotify.clientSecret=
